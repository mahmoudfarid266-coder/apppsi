name: Build unsigned IPA

# Produces an UNSIGNED .ipa on a GitHub-hosted macOS runner. SideStore re-signs
# it with a free Apple ID on install, so no Apple Developer Program is needed.
#
# `expo prebuild --platform ios` cannot run on Windows, so this runner is the
# only place the native project is ever generated.
#
# The build log is pushed to the `buildlog` branch on every run, success or
# failure. Artifact and log APIs require authentication even on a public repo;
# a branch does not. That is how the log gets read.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ipa:
    # macos-15 defaults to Swift 6.1. Expo SDK 57's 'apple' package declares
    # swift-tools-version 6.2, so package resolution fails there with:
    #   "package 'apple' is using Swift tools version 6.2.0 but the installed
    #    version is 6.1.0"
    # macos-26 defaults to Xcode 26.6 (since 2026-07-21), which ships Swift 6.2.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode and verify Swift >= 6.2
        run: |
          set -euo pipefail
          echo "--- installed Xcodes ---"
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          echo "selected: $NEWEST"
          xcodebuild -version
          swift --version
          SWIFT_MAJOR_MINOR=$(swift --version 2>&1 | grep -oE 'Swift version [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "swift tools: $SWIFT_MAJOR_MINOR"
          # Fail early and loudly rather than 12 minutes later in package resolution.
          if [ "$(printf '%s\n6.2\n' "$SWIFT_MAJOR_MINOR" | sort -V | head -1)" != "6.2" ]; then
            echo "::error::Swift $SWIFT_MAJOR_MINOR is below the 6.2 required by Expo SDK 57"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Locate workspace and scheme
        id: xc
        # schemes[0] is WRONG. The workspace lists every CocoaPods scheme too,
        # and on v0.1.3 that picked `EXConstants` — a Pod — so xcodebuild tried
        # to build a Pod target standalone and died resolving its packages.
        # The app scheme is the one named after the workspace.
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          BASE=$(basename "$WORKSPACE" .xcworkspace)
          echo "--- all schemes in workspace ---"
          xcodebuild -workspace "$WORKSPACE" -list || true
          xcodebuild -workspace "$WORKSPACE" -list -json > /tmp/schemes.json
          SCHEME=$(jq -r --arg b "$BASE" '.workspace.schemes | if index($b) then $b else .[0] end' /tmp/schemes.json)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "SELECTED workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build unsigned Release
        id: build
        continue-on-error: true
        # Forcing CODE_SIGN_STYLE=Manual with an empty DEVELOPMENT_TEAM is the
        # part that was missing. With Automatic signing, xcodebuild resolves a
        # team BEFORE honouring CODE_SIGNING_ALLOWED=NO and fails with
        # "Signing for 'X' requires a development team" — the classic unsigned
        # React Native device-build failure.
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log

      - name: Publish build log to the buildlog branch
        if: always()
        run: |
          mkdir -p /tmp/lg
          # Full log, gzipped. Round-tripping 400-line tails wastes a 12-minute
          # cycle every time the error sits above the window.
          gzip -c build.log > /tmp/lg/build-full.log.gz 2>/dev/null || true
          tail -400 build.log > /tmp/lg/build-tail.log 2>/dev/null || echo "no build.log" > /tmp/lg/build-tail.log
          # 40 lines of context around each resolution/error marker.
          grep -nE -A40 "Could not resolve package dependencies" build.log \
            > /tmp/lg/spm-context.log 2>/dev/null || echo "(no SPM error)" > /tmp/lg/spm-context.log
          grep -nE "error:|fatal error|\*\* BUILD FAILED|requires a development team|No such module" build.log \
            > /tmp/lg/errors.log 2>/dev/null || echo "(no error: lines matched)" > /tmp/lg/errors.log
          find build -type d -name '*.app' > /tmp/lg/apps.log 2>/dev/null || true
          {
            echo "run ${{ github.run_id }} / build outcome: ${{ steps.build.outcome }}"
            APP=$(find build -type d -name '*.app' | head -1)
            [ -n "$APP" ] && echo "app size: $(du -sk "$APP" | cut -f1) KB"
          } > /tmp/lg/status.log
          cd /tmp/lg
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          git add -A
          git commit -qm "build log for run ${{ github.run_id }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            HEAD:refs/heads/buildlog
          echo "pushed to buildlog branch"

      # NOT a hard stop. On v0.1.5 the Rudder.app was produced even though a
      # CocoaPods script phase (ExpoModulesJSI xcframework) failed. If a real
      # app exists, package it — the caveat is reported at the end.
      - name: Note build outcome
        if: steps.build.outcome != 'success'
        run: echo "::warning::xcodebuild reported failure; packaging any .app that was still produced"

      - name: Package into an .ipa
        run: |
          set -euo pipefail
          APP=$(find build -type d -name '*.app' -path '*iphoneos*' | head -1)
          [ -n "$APP" ] || APP=$(find build -type d -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app product found"; exit 1
          fi
          BIN="$APP/$(basename "$APP" .app)"
          [ -f "$BIN" ] || { echo "::error::no executable in $APP"; ls -la "$APP"; exit 1; }
          echo "Packaging $APP ($(du -sh "$APP" | cut -f1))"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry rudder-unsigned.ipa Payload
          SIZE=$(stat -f%z rudder-unsigned.ipa)
          echo "ipa size: $SIZE bytes"
          [ "$SIZE" -ge 1000000 ] || { echo "::error::ipa only $SIZE bytes"; exit 1; }
          ls -lh rudder-unsigned.ipa

      # PRIMARY delivery: a GitHub Release asset.
      #
      # Branch pushes reject any file over 100 MB, which is what killed v0.2.0
      # once react-native-maps landed. Release assets allow up to 2 GB AND are
      # downloadable with no authentication on a public repo — better than both
      # the branch hack and artifacts (which are 401 even when public).
      - name: Publish the ipa as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || TAG="build-${GITHUB_RUN_ID}"
          SIZE=$(stat -f%z rudder-unsigned.ipa)
          echo "publishing $SIZE bytes as release $TAG"
          gh release create "$TAG" rudder-unsigned.ipa \
            --title "Rudder $TAG (unsigned)" \
            --notes "Unsigned ipa for SideStore. $SIZE bytes. Run ${GITHUB_RUN_ID}." \
            || gh release upload "$TAG" rudder-unsigned.ipa --clobber
          echo "download: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/rudder-unsigned.ipa"

      # SECONDARY: keep the branch copy when it fits. Non-fatal by design —
      # a size rejection here must not discard a good build.
      - name: Also push to the ipa branch (best effort)
        continue-on-error: true
        run: |
          SIZE=$(stat -f%z rudder-unsigned.ipa)
          if [ "$SIZE" -gt 94000000 ]; then
            echo "::warning::$SIZE bytes exceeds the practical branch limit; release asset only"
            exit 0
          fi
          mkdir -p /tmp/rel && cp rudder-unsigned.ipa /tmp/rel/
          cd /tmp/rel
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          git add -A
          git commit -qm "unsigned ipa from run ${{ github.run_id }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            HEAD:refs/heads/ipa

      - uses: actions/upload-artifact@v4
        with:
          name: rudder-unsigned-ipa
          path: rudder-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
