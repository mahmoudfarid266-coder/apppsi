name: Build unsigned IPA

# Produces an UNSIGNED .ipa on a GitHub-hosted macOS runner, downloadable as a
# build artifact. SideStore (or AltStore) re-signs it with your free Apple ID on
# install, so this path needs no Apple Developer Program membership.
#
# Why this exists: `expo prebuild --platform ios` cannot run on Windows — it
# requires macOS or Linux — and EAS cloud builds for a physical device require
# Apple signing credentials. A macOS runner is the only $0 route to an .ipa.
#
# Run it from the Actions tab (workflow_dispatch) or on a tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Locate workspace and scheme
        id: xc
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build unsigned Release
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Package into an .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry rudder-unsigned.ipa Payload
          ls -lh rudder-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: rudder-unsigned-ipa
          path: rudder-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
