name: Build unsigned IPA

# Produces an UNSIGNED .ipa on a GitHub-hosted macOS runner, downloadable as a
# build artifact. SideStore (or AltStore) re-signs it with your free Apple ID on
# install, so this path needs no Apple Developer Program membership.
#
# Why this exists: `expo prebuild --platform ios` cannot run on Windows — it
# requires macOS or Linux — and EAS cloud builds for a physical device require
# Apple signing credentials. A macOS runner is the only $0 route to an .ipa.
#
# Run it from the Actions tab (workflow_dispatch) or on a tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Locate workspace and scheme
        id: xc
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: List available schemes
        run: |
          xcodebuild -workspace "${{ steps.xc.outputs.workspace }}" -list || true

      - name: Build unsigned Release
        # No `| xcpretty`. It is not preinstalled on macos-15, and piping into a
        # missing binary gives xcodebuild a broken pipe — it dies early while
        # PIPESTATUS[0] can still read as 0, producing a green step with no
        # product. That is exactly what happened on v0.1.1.
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Show build products
        run: |
          echo "--- .app products found ---"
          find build -type d -name '*.app' | head -20 || true
          echo "--- Products tree ---"
          ls -la build/Build/Products/ 2>/dev/null || echo "(no build/Build/Products)"

      - name: Package into an .ipa
        run: |
          set -euo pipefail

          # Search the whole derived-data tree, not one guessed directory.
          APP=$(find build -type d -name '*.app' -path '*iphoneos*' | head -1)
          if [ -z "$APP" ]; then
            APP=$(find build ~/Library/Developer/Xcode/DerivedData -type d -name '*.app' 2>/dev/null | head -1)
          fi

          # Fail loudly. A previous run packaged an empty Payload/ and still
          # exited 0, producing a 302-byte "ipa". Never again.
          if [ -z "$APP" ]; then
            echo "::error::No .app product found. Tree follows:"
            find build -maxdepth 6 -type d -name '*.app' -o -maxdepth 4 -type d | head -50
            exit 1
          fi

          BIN="$APP/$(basename "$APP" .app)"
          if [ ! -f "$BIN" ]; then
            echo "::error::$APP contains no executable at $BIN"
            ls -la "$APP"; exit 1
          fi
          echo "Packaging $APP ($(du -sh "$APP" | cut -f1))"
          file "$BIN"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry rudder-unsigned.ipa Payload

          # An .ipa under 1 MB is empty by definition — Hermes alone is ~2.7 MB.
          SIZE=$(stat -f%z rudder-unsigned.ipa)
          echo "ipa size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::ipa is only $SIZE bytes — packaging produced an empty archive"
            unzip -l rudder-unsigned.ipa | head -30
            exit 1
          fi
          ls -lh rudder-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: rudder-unsigned-ipa
          path: rudder-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
